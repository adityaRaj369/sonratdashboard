services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonrat
      POSTGRES_PASSWORD: sonrat
      POSTGRES_DB: sonrat
    ports:
      - "5432:5432"
    volumes:
      - sonrat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonrat -d sonrat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sonrat
      MINIO_ROOT_PASSWORD: sonratsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sonrat_minio:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  voice-runtime:
    build:
      context: .
      dockerfile: apps/voice-runtime/Dockerfile
    env_file: .env
    ports:
      - "4100:4100"
    depends_on:
      - api
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sonrat_pg:
  sonrat_minio:
